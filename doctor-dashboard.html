<h2>Doctor Dashboard - PHC</h2>
<div id="list"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";
// Same firebase config
const db = getFirestore(initializeApp({apiKey:"YOUR_API_KEY", projectId:"YOUR_PROJECT_ID"}));

// Live patient queue - Realtime
onSnapshot(collection(db,"patients"), (snap)=>{
  let html="";
  snap.forEach(doc=>{
    let d=doc.data();
    html+=`<div style="border:1px solid #ccc;padding:10px;margin:5px">${d.name} - BP:${d.bp} - <b>${d.risk}</b> - ${d.timestamp.toDateString()}</div>`;
  });
  document.getElementById('list').innerHTML=html;
});
</script>
