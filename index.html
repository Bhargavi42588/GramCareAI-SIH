<!DOCTYPE html>
<html>
<head><title>GramCareAI</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#f0f7ff;font-family:sans-serif;margin:0}.h{background:#0d47a1;color:#fff;padding:15px;text-align:center}.nav{display:flex;background:#fff}button{flex:1;padding:14px;border:none;font-weight:bold}button.a{color:#0d47a1;border-bottom:3px solid #0d47a1;background:#e3f2fd}.s{display:none;padding:15px;max-width:500px;margin:auto}.s.on{display:block}.card{background:#fff;padding:15px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 8px #0001}.btn{width:100%;padding:14px;background:#0d47a1;color:#fff;border:none;border-radius:8px;font-weight:bold;margin-top:8px}.tok{background:#e8f5e9;border:2px dashed #2e7d32;padding:15px;text-align:center;border-radius:12px}.t{font-size:32px;font-weight:bold;color:#2e7d32}</style></head>
<body><div class="h"><h1>GramCareAI</h1><p>SIH 2025 Gadchiroli</p></div><div class="nav"><button id="b-p" class="a" onclick="f('p')">Patient</button><button id="b-a" onclick="f('a')">ASHA</button><button id="b-d" onclick="f('d')">Doctor</button></div>
<div id="p" class="s on"><div class="card"><h3>ABHA Login</h3><input id="ab" style="width:100%;padding:12px;border:1px solid #ccc;border-radius:8px" placeholder="ABHA Number"><button class="btn" onclick="s1.innerText='✅ Verified - '+ab.value">Verify</button><p id="s1" style="color:green"></p></div><div class="card"><h3>Book Token</h3><button class="btn" style="background:#2e7d32" onclick="ta.style.display='block';tn.innerText='TKN-'+(800+Math.floor(Math.random()*150))">Generate Token</button><div id="ta" style="display:none" class="tok"><p>Your Token</p><div class="t" id="tn">TKN-848</div><p>Gadchiroli - 04-09-2026</p></div></div><div class="card"><h3>Medicine Stock</h3><p>Paracetamol - <b style="color:green">Available</b></p><p>ORS - <b style="color:green">Available</b></p><p>Amoxicillin - <b style="color:red">Out of Stock</b></p></div></div>
<div id="a" class="s"><div class="card"><h3>ASHA Entry - Offline</h3><input style="width:100%;padding:10px;margin:5px 0" placeholder="Patient Name"><input style="width:100%;padding:10px;margin:5px 0" placeholder="Village"><button class="btn">🎤 Bhashini Voice</button><button class="btn" style="background:#2e7d32" onclick="alert('Saved Offline!')">Save</button></div></div>
<div id="d" class="s"><div class="card"><h3>Doctor Dashboard</h3><p>Queue: 24 Patients</p><p><b>TKN-848 - PAVAN - Next</b></p></div></div>
<script>function f(x){document.querySelectorAll('.s').forEach(e=>e.classList.remove('on'));document.querySelectorAll('.nav button').forEach(e=>e.classList.remove('a'));document.getElementById(x).classList.add('on');document.getElementById('b-'+x).classList.add('a')}</script></body></html>
